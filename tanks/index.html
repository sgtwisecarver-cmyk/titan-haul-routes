<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Titan Tank Board</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#1b1e24; --card:#262a33; --card2:#1f232b; --line:#3a3f4b;
  --text:#e8eaef; --dim:#a6acb8; --cyan:#2bb0e8; --orange:#f5a623;
  --crit:#ff5a5a; --warn:#f5a623; --info:#2bb0e8; --ok:#35c65f; --skim:#b98cff; --neutral:#8c98ad;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#eef1f5; --card:#ffffff; --card2:#f4f6f9; --line:#dde1e8; --text:#16181d; --dim:#5a6472; }
}
*{box-sizing:border-box}
body{margin:0; font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%;}
/* ===== gate ===== */
#gate{position:fixed; inset:0; z-index:100; background:linear-gradient(160deg,#0d1338,#141c52 60%,#1e2a78); display:flex; align-items:center; justify-content:center; padding:24px;}
#gate .box{width:100%; max-width:330px; text-align:center;}
#gate .glogo{display:inline-flex;background:#fff;border-radius:10px;padding:10px 18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.45);}
#gate .glogo img{display:block;height:64px;width:auto;}
#gate .sub{font-family:"Barlow Condensed","Arial Narrow","Segoe UI",sans-serif;color:#7fd2f5; font-size:16px; letter-spacing:3px; font-weight:600; margin:2px 0 22px;}
#gate .lbl{color:#c7d6ee; font-size:16px; margin-bottom:8px;}
#gate input{width:100%; padding:13px 14px; border-radius:10px; border:1px solid #3a3f4b; background:#141c52; color:#fff; font-size:20px;min-height:54px;box-sizing:border-box; text-align:center; letter-spacing:2px;}
#gate button{width:100%; margin-top:12px; padding:15px;min-height:54px; border:0; border-radius:10px; background:linear-gradient(180deg,#2a3a9e,#1e2a78); color:#fff; font-weight:800; font-size:16px; cursor:pointer;}
#gate .err{color:#ff8a8a; font-size:16px; height:18px; margin-top:10px;}
/* ===== app ===== */
#app{display:none; max-width:1050px; margin:0 auto; padding:14px 14px 60px;}
header.top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:4px 2px 12px;}
.logobadge{display:inline-flex;align-items:center;background:#fff;border-radius:8px;padding:4px 10px;box-shadow:0 2px 10px rgba(0,0,0,.4);}
.logobadge img{display:block;height:34px;width:auto;}
.htitle{font-family:"Barlow Condensed","Arial Narrow","Segoe UI",sans-serif;font-weight:600; font-size:18px; color:var(--text); letter-spacing:1.5px; text-transform:uppercase;}
.backlink{color:var(--cyan); text-decoration:none; font-weight:700; font-size:16px; border:1px solid var(--line); border-radius:8px; padding:6px 11px; white-space:nowrap;min-height:44px;display:inline-flex;align-items:center;box-sizing:border-box;}
.spacer{flex:1}
.toggle{display:flex; gap:6px; background:var(--card2); padding:4px; border-radius:10px;}
.toggle button{border:0; background:transparent; color:var(--dim); font-weight:700; font-size:16px; padding:10px 16px;min-height:44px; border-radius:7px; cursor:pointer;}
.toggle button.on{background:var(--cyan); color:#04121e;}
/* headline */
.headline{border-radius:14px; padding:14px 16px; margin-bottom:14px; font-size:16px; font-weight:700; display:flex; align-items:center; gap:10px; border:1px solid var(--line); background:var(--card);}
.headline .big{font-size:22px}
.headline.calm{border-left:5px solid var(--ok)} .headline.busy{border-left:5px solid var(--warn)} .headline.hot{border-left:5px solid var(--crit)}
/* kpis */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px;}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; border-left-width:4px;}
.kpi .n{font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;}
.kpi .l{font-size:14px; color:var(--dim); margin-top:6px; line-height:1.25;}
.kpi.crit{border-left-color:var(--crit)} .kpi.warn{border-left-color:var(--warn)} .kpi.info{border-left-color:var(--info)} .kpi.ok{border-left-color:var(--ok)} .kpi.neutral{border-left-color:var(--neutral)} .kpi.skim{border-left-color:var(--skim)}
/* controls */
.controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; font-size:15px; color:var(--dim);}
.controls select{background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:16px; font-weight:600;min-height:44px;}
.controls .rt{margin-left:auto; display:flex; gap:8px; align-items:center;}
.controls button{border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:7px 12px; font-size:15px; font-weight:700; cursor:pointer;min-height:44px;}
/* pad cards */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px;}
.pad{background:var(--card); border:1px solid var(--line); border-top-width:4px; border-radius:14px; padding:14px; }
.pad.crit{border-top-color:var(--crit)} .pad.warn{border-top-color:var(--warn)} .pad.info{border-top-color:var(--info)} .pad.ok{border-top-color:var(--ok)} .pad.skim{border-top-color:var(--skim)} .pad.neutral{border-top-color:var(--neutral)}
.pad .r1{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.pad .name{font-weight:800; font-size:17px; line-height:1.2;}
.pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:14px; font-weight:800; white-space:nowrap; text-transform:uppercase; letter-spacing:.3px;}
.pill.crit{background:rgba(255,90,90,.18); color:#ff8f8f} .pill.warn{background:rgba(245,166,35,.18); color:#f5b850}
.pill.info{background:rgba(49,192,247,.16); color:#68cff8} .pill.ok{background:rgba(53,198,95,.16); color:#63d488}
.pill.skim{background:rgba(185,140,255,.18); color:#c9a9ff} .pill.neutral{background:rgba(140,152,173,.18); color:var(--dim)}
.hero{margin:12px 0 4px; display:flex; align-items:baseline; gap:8px;}
.hero .v{font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;}
.hero .u{font-size:16px; color:var(--dim); font-weight:600;}
.hero.lo .v{color:var(--crit)} .hero.mid .v{color:var(--warn)}
.herolab{font-size:14px; color:var(--dim); margin-bottom:10px;}
.chips{display:flex; flex-wrap:wrap; gap:6px;}
.chip{background:var(--card2); border-radius:8px; padding:5px 9px; font-size:14px;}
.chip b{font-variant-numeric:tabular-nums;}
.det{margin-top:10px; font-size:15px;}
.det summary{cursor:pointer; color:var(--cyan); font-weight:700; font-size:14px; list-style:none;}
.det summary::-webkit-details-marker{display:none}
.det summary::before{content:'▸ '; }
.det[open] summary::before{content:'▾ '; }
.det .grid2{display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; margin-top:8px;}
.det .grid2 div{display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line); padding:3px 0;}
.det .grid2 .k{color:var(--dim)} .det .grid2 .val{font-variant-numeric:tabular-nums; text-align:right}
.det .notes{margin-top:8px; color:var(--dim); font-size:14px; line-height:1.5}
.loading{padding:50px; text-align:center; color:var(--dim)}
.err2{padding:24px; text-align:center; color:#ff8f8f; line-height:1.6}
.foot{margin-top:20px; font-size:14px; color:var(--dim); text-align:center; line-height:1.7}
.foot a{color:var(--cyan); text-decoration:none}
</style></head>
<body>
<div id="gate"><div class="box">
<div class="glogo"><img src="../img/titan-logo.png" alt="Titan Energy Transportation LLC"></div><div class="sub">TANK BOARD</div>
<div class="lbl">Enter passcode</div>
<input id="pc" type="password" inputmode="text" autocomplete="off" autofocus>
<button id="unlock">Unlock</button>
<div class="err" id="gerr"></div>
</div></div>

<div id="app">
<header class="top">
  <a href="../index.html" class="backlink">← Routes</a>
  <a class="logobadge" href="../index.html"><img src="../img/titan-logo.png" alt="Titan Energy Transportation LLC"></a>
  <div class="htitle">Tank Board</div>
  <div class="spacer"></div>
  <div class="toggle"><button id="tAsc" class="on">Ascent</button><button id="tEog">EOG</button></div>
</header>

<div class="headline" id="headline">—</div>
<div class="kpis" id="kpis"></div>
<div class="controls">
  <label>Sort:
    <select id="sort">
      <option value="urgent">Most urgent first</option>
      <option value="name">Pad name</option>
    </select>
  </label>
  <span class="rt"><span id="fetched" style="font-size:11px"></span><button id="refresh">↻ Refresh</button></span>
</div>
<div id="content" class="loading">Loading…</div>
<div class="foot">Internal — Titan Energy Transportation. Auto-refreshes every 3 minutes.<br>
Time shown is hours until a pad reaches shutdown (tanks full). <a href="../index.html">← Haul Routes</a></div>
</div>

<script>
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const REAL_HASH="a1ec3157b1476f8697b932297639ddee8462cb5895dcf1967c34c48fe92b3870";
const ALIAS={Ascent:{"Skull Fork":"Skull Fork A"}};
async function tryUnlock(v){ if(await sha(v)===REAL_HASH){ try{sessionStorage.setItem('titan_tanks_ok','1')}catch(e){}; showApp(); return true;} return false; }
function showApp(){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; load(); }
document.getElementById('unlock').onclick=async()=>{ if(!await tryUnlock(document.getElementById('pc').value)) document.getElementById('gerr').textContent='Incorrect passcode'; };
document.getElementById('pc').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('unlock').click(); });
try{ if(sessionStorage.getItem('titan_tanks_ok')==='1') showApp(); }catch(e){}

const SRC={
  Ascent:{url:"https://docs.google.com/spreadsheets/d/e/2PACX-1vRql7lfsC1RMXEqlyEPkFcTzX5HNQ9sqL8sX_MHU8WsF_Lsip5IPbGmy-trkAxxKNK-sgpFb8UgGsfc/pub?gid=1846056363&single=true&output=csv",
    padCol:"Pad", statusCol:"Status", esdCol:"Hrs to ESD",
    cols:["Pad","Status","Hrs to ESD","Hrs to Alarm","Hrs to Load","Loads","bbl/hr","Water bbl","Oil bbl","Pullable bbl","Max Level in","Live Tank","Zone","Size","Tanks","Notes"],
    chips:r=>[['Loads ready',r['Loads']],['Level',r['Max Level in']?r['Max Level in']+'"':'']],
    detail:["Hrs to Alarm","Hrs to Load","bbl/hr","Water bbl","Oil bbl","Pullable bbl","Live Tank","Size","Tanks"], notesCol:"Notes"},
  EOG:{url:"https://docs.google.com/spreadsheets/d/e/2PACX-1vT-uJNhS0Sn7Yg7JKneX8W8ee_zv7_UqHFQjM4EoA4v2bQhPswRRKJjL3X8gJfgto882Kp1WO4mNkmL/pub?gid=1156597874&single=true&output=csv",
    padCol:"PAD", statusCol:"STATUS", esdCol:"HRS TO ESD",
    cols:["PAD","TANKS","AVG TOP","MAX TOP","AVG INT","PROD (BPD)","BPH","HRS TO ESD","NEED","LDS >6'","LDS 3-6'","% FULL","YARD / DISPOSAL","OIL","STATUS","LOADS/SHIFT"],
    chips:r=>[['% full',r['% FULL']],["Above 6'",r["LDS >6'"]],['Loads/shift',r['LOADS/SHIFT']]],
    detail:["NEED","TANKS","AVG TOP","MAX TOP","PROD (BPD)","BPH","LDS 3-6'","OIL","LOADS/SHIFT"], notesCol:"YARD / DISPOSAL"}
};
let CUR="Ascent", SORTBY="urgent", RAW={};

function parseCSV(t){ const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else{ if(c==='"')q=true; else if(c===','){row.push(f);f=""} else if(c==='\n'){row.push(f);rows.push(row);row=[];f=""} else if(c==='\r'){} else f+=c } }
  if(f.length||row.length){row.push(f);rows.push(row)} return rows; }
function severity(s){ s=(s||"").toUpperCase();
  if(s.includes('CRITICAL')||s.includes('OVER ALARM')||s.includes('90'))return 'crit';
  if(s.includes('URGENT')||s.includes('APPROACH'))return 'warn';
  if(s.includes('SKIM'))return 'skim';
  if(s.includes('HIGH')||s.includes('LOAD READY'))return 'info';
  if(s.includes('OK')||s.includes('FILLING')||s.includes('WORKING FLOOR'))return 'ok';
  return 'neutral'; }
function num(v){ const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?null:n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cleanStatus(s){ return String(s||'').replace(/[^\x00-\x7F]+/g,'').trim()||s; }

async function load(){
  const cfg=SRC[CUR];
  const c=document.getElementById('content'); c.className='loading'; c.textContent='Loading '+CUR+' tanks…';
  try{ const res=await fetch(cfg.url,{cache:'no-store'}); RAW[CUR]=await res.text(); render();
    document.getElementById('fetched').textContent='updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  }catch(e){ c.className='err2'; c.innerHTML='Couldn’t load the sheet.<br>Make sure it’s still <b>Published to web</b> in Google Sheets.'; }
}
function records(){
  const cfg=SRC[CUR]; const rows=parseCSV(RAW[CUR]||"");
  let hi=rows.findIndex(r=>r.map(x=>x.trim()).includes(cfg.padCol)); if(hi<0) return null;
  const header=rows[hi].map(x=>x.trim()); const idx={}; cfg.cols.forEach(c=>idx[c]=header.indexOf(c));
  return rows.slice(hi+1).filter(r=>r[idx[cfg.padCol]]&&r[idx[cfg.padCol]].trim()).map(r=>{
    const o={}; cfg.cols.forEach(c=>o[c]= idx[c]>=0?(r[idx[c]]||'').trim():''); o._sev=severity(o[cfg.statusCol]); o._esd=num(o[cfg.esdCol]); return o; });
}
function render(){
  const cfg=SRC[CUR]; const recs=records();
  if(!recs){ const c=document.getElementById('content'); c.className='err2'; c.textContent='Unexpected sheet format.'; return; }
  if(SORTBY==='name') recs.sort((a,b)=>a[cfg.padCol].localeCompare(b[cfg.padCol]));
  else recs.sort((a,b)=>{ if(a._esd==null)return 1; if(b._esd==null)return -1; return a._esd-b._esd; });
  renderHead(recs); renderKpis(recs); renderCards(recs,cfg);
}
function renderHead(recs){
  const crit=recs.filter(r=>r._sev==='crit').length, warn=recs.filter(r=>r._sev==='warn').length;
  const h=document.getElementById('headline'); let cls,txt;
  if(crit>0){ cls='hot'; txt='<span class="big">🔴 '+crit+' pad'+(crit>1?'s':'')+' need a truck now</span>'+(warn?' · 🟡 '+warn+' getting close':''); }
  else if(warn>0){ cls='busy'; txt='<span class="big">🟡 '+warn+' pad'+(warn>1?'s':'')+' getting close</span> · nothing critical yet'; }
  else { cls='calm'; txt='<span class="big">✅ Field is in good shape</span> · no pads at alarm'; }
  h.className='headline '+cls; h.innerHTML=txt;
}
function renderKpis(recs){
  const crit=recs.filter(r=>r._sev==='crit').length, warn=recs.filter(r=>r._sev==='warn').length;
  const tiles=[['crit',crit,CUR==='Ascent'?'Over alarm — haul now':'Critical — haul now'],
               ['warn',warn,CUR==='Ascent'?'Approaching alarm':'Urgent soon'],
               ['neutral',recs.length,'Pads on board']];
  if(CUR==='Ascent'){ tiles.push(['ok',recs.reduce((s,r)=>s+(num(r['Loads'])||0),0),'Loads ready to pull now']); }
  else{ tiles.push(['ok',recs.reduce((s,r)=>s+(num(r["LDS >6'"])||0),0),"Loads above 6' — ready to pull"]); }
  document.getElementById('kpis').innerHTML=tiles.map(t=>'<div class="kpi '+t[0]+'"><div class="n">'+t[1]+'</div><div class="l">'+esc(t[2])+'</div></div>').join('');
}
function renderCards(recs,cfg){
  const html=recs.map(r=>{
    const esd=r._esd, hcls=esd!=null&&esd<6?'lo':(esd!=null&&esd<14?'mid':'');
    const chips=cfg.chips(r).filter(c=>c[1]!=null&&String(c[1]).trim()!=='').map(c=>'<span class="chip">'+esc(c[0])+' <b>'+esc(c[1])+'</b></span>').join('');
    const dets=cfg.detail.filter(k=>r[k]!=null&&String(r[k]).trim()!=='').map(k=>'<div><span class="k">'+esc(k)+'</span><span class="val">'+esc(r[k])+'</span></div>').join('');
    const notes=r[cfg.notesCol]&&r[cfg.notesCol].trim()?'<div class="notes">'+esc(cfg.notesCol==='YARD / DISPOSAL'?'Yard / Disposal: ':'')+esc(r[cfg.notesCol])+'</div>':'';
    const nm=(ALIAS[CUR]&&ALIAS[CUR][r[cfg.padCol]])||r[cfg.padCol];
    return '<div class="pad '+r._sev+'"><div class="r1"><div class="name">'+esc(nm)+'</div>'+
      '<span class="pill '+r._sev+'">'+esc(cleanStatus(r[cfg.statusCol]))+'</span></div>'+
      '<div class="hero '+hcls+'"><span class="v">'+(esd!=null?esd:'—')+'</span><span class="u">hrs to shutdown</span></div>'+
      '<div class="chips">'+chips+'</div>'+
      ((dets||notes)?'<details class="det"><summary>Details</summary><div class="grid2">'+dets+'</div>'+notes+'</details>':'')+
      '</div>';
  }).join('');
  const c=document.getElementById('content'); c.className=''; c.innerHTML='<div class="grid">'+html+'</div>';
}
document.getElementById('tAsc').onclick=()=>{ CUR='Ascent'; document.getElementById('tAsc').classList.add('on'); document.getElementById('tEog').classList.remove('on'); load(); };
document.getElementById('tEog').onclick=()=>{ CUR='EOG'; document.getElementById('tEog').classList.add('on'); document.getElementById('tAsc').classList.remove('on'); load(); };
document.getElementById('sort').onchange=e=>{ SORTBY=e.target.value; if(RAW[CUR]) render(); };
document.getElementById('refresh').onclick=load;
setInterval(()=>{ if(document.getElementById('app').style.display==='block') load(); }, 180000);
</script>
</body></html>
