name: OHGO road alerts
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ohgo-alerts
  cancel-in-progress: false
jobs:
  build-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build alerts.json from OHGO
        env:
          OHGO_API_KEY: ${{ secrets.OHGO_API_KEY }}
        run: python ohgo/ohgo_alerts.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- alerts.json; then
            git config user.name  "titan-ohgo-bot"
            git config user.email "actions@users.noreply.github.com"
            git add alerts.json
            git commit -m "OHGO alerts refresh"
            git push
          else
            echo "no change"
          fi