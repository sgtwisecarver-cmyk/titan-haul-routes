# Publishes the site to GitHub Pages (titanenergytech.com).
# Replaces GitHub's built-in "pages build and deployment". GitHub caps the deploy wait at 10 minutes
# (a longer timeout is ignored), so when GitHub's Pages sync is slow a run can still time out; the next push retries.
# Runs on every push to main, and when the OHGO alerts job commits a new alerts.json
# (its pushes use the built-in token, which can't trigger a push run, so it calls this one directly).
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"   # ~00:20 Eastern: rebuild pad pages so frac cards past their "until" date drop off
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Build pad pages + sitemap (one Google-listable page per pad card)
        run: python3 tools/build_pages.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
